<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 580" role="img" aria-labelledby="title desc"><title id="title">Tỷ trọng điện gió và mặt trời: 2015 và 2024</title><desc id="desc">Việt Nam tăng từ 0,079% lên 14,697%, mức tăng lớn nhất trong năm nước. Thái Lan 5,802%, Malaysia 3,016%, Philippines 2,883%, Indonesia 0,372% năm 2024. Chênh lệch tính bằng điểm phần trăm.</desc><g font-family="Arial, sans-serif"><text x="0" y="23" font-size="19" fill="#1d2b31" text-anchor="start" font-weight="bold">Tỷ trọng điện gió + mặt trời (%)</text><circle cx="10" cy="48" r="5" fill="#faf8f1" stroke="#47575d" stroke-width="2.5"/><text x="24" y="54" font-size="18" fill="#47575d" text-anchor="start" font-weight="normal">2015</text><circle cx="98" cy="48" r="5" fill="#1d2b31" stroke="#1d2b31" stroke-width="2.5"/><text x="111" y="54" font-size="18" fill="#47575d" text-anchor="start" font-weight="normal">2024</text><text x="183" y="54" font-size="18" fill="#47575d" text-anchor="start" font-weight="normal">Thang 0–16%</text><text x="0" y="83" font-size="20" fill="#1d2b31" text-anchor="start" font-weight="bold">Việt Nam</text><text x="345" y="83" font-size="18" fill="#1d2b31" text-anchor="end" font-weight="normal">+14,62 điểm %</text><line x1="14" y1="105" x2="314" y2="105" stroke="#d7dcd8" stroke-width="2" /><line x1="15.48125" y1="105" x2="289.56874999999997" y2="105" stroke="#00695e" stroke-width="4" /><circle cx="15.48125" cy="105" r="5" fill="#faf8f1" stroke="#00695e" stroke-width="2.5"/><circle cx="289.56874999999997" cy="105" r="6" fill="#00695e" stroke="#00695e" stroke-width="2.5"/><text x="0" y="129" font-size="18" fill="#47575d" text-anchor="start" font-weight="normal">2015: 0,08</text><text x="345" y="129" font-size="18" fill="#00695e" text-anchor="end" font-weight="bold">2024: 14,70</text><text x="0" y="162" font-size="20" fill="#1d2b31" text-anchor="start" font-weight="bold">Thái Lan</text><text x="345" y="162" font-size="18" fill="#1d2b31" text-anchor="end" font-weight=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" role="img" aria-labelledby="title desc"><title id="title">Sản lượng gió và mặt trời vẫn tăng khi tỷ trọng giảm</title><desc id="desc">Việt Nam năm 2024: điện gió và mặt trời tăng 6,96% từ 42,683 lên 45,655 TWh; tổng phát điện tăng 10,15% từ 282,000 lên 310,633 TWh. Tổng tăng nhanh hơn nên tỷ trọng gió và mặt trời giảm. Đây là quan hệ số học, không xác định nguyên nhân chính sách hoặc lưới điện.</desc><g font-family="Arial, sans-serif"><text x="0" y="25" font-size="22" fill="#1d2b31" text-anchor="start" font-weight="bold">Việt Nam: tăng sản lượng từ 2023 đến 2024 (%)</text><line x1="390.0" y1="57" x2="390.0" y2="257" stroke="#d7dcd8" stroke-width="1" /><text x="390.0" y="280" font-size="20" fill="#47575d" text-anchor="middle" font-weight="normal">0%</text><line x1="533.3333333333334" y1="57" x2="533.3333333333334" y2="257" stroke="#d7dcd8" stroke-width="1" /><text x="533.3333333333334" y="280" font-size="20" fill="#47575d" text-anchor="middle" font-weight="normal">4%</text><line x1="676.6666666666667" y1="57" x2="676.6666666666667" y2="257" stroke="#d7dcd8" stroke-width="1" /><text x="676.6666666666667" y="280" font-size="20" fill="#47575d" text-anchor="middle" font-weight="normal">8%</text><line x1="820.0" y1="57" x2="820.0" y2="257" stroke="#d7dcd8" stroke-width="1" /><text x="820.0" y="280" font-size="20" fill="#47575d" text-anchor="middle" font-weight="normal">12%</text><text x="0" y="97" font-size="23" fill="#1d2b31" text-anchor="start" font-weight="bold">Điện gió + mặt trời</text><text x="0" y="127" font-size="22" fill="#47575d" text-anchor="start" font-weight="normal">42,68 → 45,66 TWh</text><rect x="390" y="82" width="249.50604846582166" height="31" fill="#00695e"/><text x="651.5060484658217" y="106" font-size="23" fill="#00695e" text-anchor="start" font-weight="bold">+6,96%</text><text x="0" y="204" font-size="23" fill="#1d2b31" text-anchor="start" font-weight="bold">Tổng phát điện</text><text x="0" y="234" font-size="22" fill="#47575d" text-anchor="start" font-weight="normal">282,00 → 310,63 TWh</text><rect x="390" y="189" width="363.83540189125296" height="31" fill="#1d2b31"/><text x="765.835401891253" y="213" font-size="23" fill="#1d2b31" text-anchor="start" font-weight="bold">+10,15%</text><text x="0" y="321" font-size="18" fill="#47575d" text-anchor="start" font-weight="normal">Sản lượng phát điện nội địa. Nguồn: Ember, tải 14/10/2026; CC BY 4.0.</text></g></svg>
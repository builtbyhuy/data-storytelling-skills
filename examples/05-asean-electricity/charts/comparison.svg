<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="title desc"><title id="title">Tỷ trọng điện gió và mặt trời: 2015 và 2024</title><desc id="desc">Việt Nam tăng từ 0,079% lên 14,697%, mức tăng lớn nhất trong năm nước. Thái Lan 5,802%, Malaysia 3,016%, Philippines 2,883%, Indonesia 0,372% năm 2024. Chênh lệch tính bằng điểm phần trăm.</desc><g font-family="Arial, sans-serif"><text x="0" y="25" font-size="22" fill="#1d2b31" text-anchor="start" font-weight="bold">Điện gió + mặt trời trong tổng phát điện (%)</text><circle cx="17" cy="57" r="6" fill="#faf8f1" stroke="#47575d" stroke-width="2.5"/><text x="32" y="64" font-size="20" fill="#47575d" text-anchor="start" font-weight="normal">2015</text><circle cx="112" cy="57" r="6" fill="#1d2b31" stroke="#1d2b31" stroke-width="2.5"/><text x="126" y="64" font-size="20" fill="#47575d" text-anchor="start" font-weight="normal">2024</text><text x="940" y="64" font-size="20" fill="#1d2b31" text-anchor="end" font-weight="normal">Tăng từ 2015 (điểm %)</text><line x1="175.0" y1="87" x2="175.0" y2="384" stroke="#d7dcd8" stroke-width="1" /><text x="175.0" y="414" font-size="20" fill="#47575d" text-anchor="middle" font-weight="normal">0</text><line x1="320.0" y1="87" x2="320.0" y2="384" stroke="#d7dcd8" stroke-width="1" /><text x="320.0" y="414" font-size="20" fill="#47575d" text-anchor="middle" font-weight="normal">4</text><line x1="465.0" y1="87" x2="465.0" y2="384" stroke="#d7dcd8" stroke-width="1" /><text x="465.0" y="414" font-size="20" fill="#47575d" text-anchor="middle" font-weight="normal">8</text><line x1="610.0" y1="87" x2="610.0" y2="384" stroke="#d7dcd8" stroke-width="1" /><text x="610.0" y="414" font-size="20" fill="#47575d" text-anchor="middle" font-weight="normal">12</text><line x1="755.0" y1="87" x2="755.0" y2="384" stroke="#d7dcd8" stroke-width="1" /><text x="755.0" y="414" font-size="20" fill="#47575d" text-anchor="middle" font-weight="normal">16</text><text x="0" y="123" font-size
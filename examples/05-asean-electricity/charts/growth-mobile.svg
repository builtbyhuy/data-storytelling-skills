<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 390" role="img" aria-labelledby="title desc"><title id="title">Sản lượng gió và mặt trời vẫn tăng khi tỷ trọng giảm</title><desc id="desc">Việt Nam năm 2024: điện gió và mặt trời tăng 6,96% từ 42,683 lên 45,655 TWh; tổng phát điện tăng 10,15% từ 282,000 lên 310,633 TWh. Tổng tăng nhanh hơn nên tỷ trọng gió và mặt trời giảm. Đây là quan hệ số học, không xác định nguyên nhân chính sách hoặc lưới điện.</desc><g font-family="Arial, sans-serif"><text x="0" y="22" font-size="18" fill="#1d2b31" text-anchor="start" font-weight="bold">Việt Nam · tăng sản lượng 2023–2024</text><text x="0" y="76" font-size="21" fill="#1d2b31" text-anchor="start" font-weight="bold">Điện gió + mặt trời</text><text x="0" y="105" font-size="19" fill="#47575d" text-anchor="start" font-weight="normal">42,68 → 45,66 TWh</text><rect x="0" y="121" width="165.37028793664925" height="28" fill="#00695e"/><text x="175.37028793664925" y="142" font-size="19" fill="#00695e" text-anchor="start" font-weight="bold">+6,96%</text><text x="0" y="196" font-size="21" fill="#1d2b31" text-anchor="start" font-weight="bold">Tổng phát điện</text><text x="0" y="225" font-size="19" fill="#47575d" text-anchor="start" font-weight="normal">282,00 → 310,63 TWh</text><rect x="0" y="241" width="241.14671985815605" height="28" fill="#1d2b31"/><text x="251.14671985815605" y="262" font-size="19" fill="#1d2b31" text-anchor="start" font-weight="bold">+10,15%</text><text x="0.0" y="318" font-size="18" fill="#47575d" text-anchor="start" font-weight="normal">0%</text><text x="95.0" y="318" font-size="18" fill="#47575d" text-anchor="middle" font-weight="normal">4%</text><text x="190.0" y="318" font-size="18" fill="#47575d" text-anchor="middle" font-weight="normal">8%</text><text x="285.0" y="318" font-size="18" fill="#47575d" text-anchor="middle" font-weight="normal">12%</text><text x="0" y="349" font-size="18" fill="#47575d" text-anchor="start" font-weight="normal">Phát điện nội địa; loại nhập khẩu ròng.</text><text x="0" y="376" font-size="18" fill="#47575d" text-anchor="start" font-weight="normal">Ember · 14/10/2026 · CC BY 4.0</text></g></svg>
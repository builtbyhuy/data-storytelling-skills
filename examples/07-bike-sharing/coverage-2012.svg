<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="So sánh tỷ lệ bao phủ lịch sử năm 2012" style="font-family:Segoe UI,Arial,sans-serif"><title>So sánh tỷ lệ bao phủ lịch sử năm 2012</title><desc>Hai khối được chọn riêng từ năm 2011, so với khối 10–13 trên cùng ngày đủ điều kiện năm 2012. Bảng số chính xác trong báo cáo.</desc><rect width="100%" height="100%" fill="#ffffff"/><text x="28" y="38" font-size="25" font-weight="600" fill="#1c3240" text-anchor="start">Khối từ 2011 bao phủ nhiều lượt thuê hơn khối 10–13 trong 2012</text><text x="28" y="72" font-size="18" font-weight="normal" fill="#1c3240" text-anchor="start">Tỷ lệ trên tổng cnt của 16 ô giờ 06–21, cùng tập ngày đủ điều kiện</text><text x="28" y="128" font-size="20" font-weight="600" fill="#1c3240" text-anchor="start">workingday=0 · 116 ngày · mẫu số 550.442 lượt</text><text x="28" y="182" font-size="20" font-weight="normal" fill="#1c3240" text-anchor="start">12–15</text><rect x="145" y="158" width="379.151" height="34" fill="#176c68"/><text x="534.1512093917252" y="182" font-size="21" font-weight="600" fill="#1c3240" text-anchor="start">28,6%</text><text x="28" y="237" font-size="20" font-weight="normal" fill="#1c3240" text-anchor="start">10–13</text><rect x="145" y="213" width="323.799" height="34" fill="#667681"/><text x="478.7986472689221" y="237" font-size="21" font-weight="600" fill="#1c3240" text-anchor="start">24,4%</text><text x="765" y="189" font-size="29" font-weight="600" fill="#176c68" text-anchor="start">+4,2</text><text x="765" y="219" font-size="18" font-weight="normal" fill="#1c3240" text-anchor="start">điểm phần trăm</text><text x="28" y="318" font-size="20" font-weight="600" fill="#1c3240" text-anchor="start">workingday=1 · 248 ngày · mẫu số 1.337.048 lượt</text><text x="28" y="372" font-size="20" font-weight="normal" fill="#1c3240" text-anchor="start">17–20</text><rect x="145" y="348" width="421.810" height="34" fill="#176c68"/><text x="576.8095573232972" y="372" font-size="21" font-weight="600" fill="#1c3240" text-anchor="start">31,8%</text><text x="28" y="427" font-size="20" font-weight="normal" fill="#1c3240" text-anchor="start">10–13</text><rect x="145" y="403" width="152.780" height="34" fill="#667681"/><text x="307.7797992293471" y="427" font-size="21" font-weight="600" fill="#1c3240" text-anchor="start">11,5%</text><text x="765" y="379" font-size="29" font-weight="600" fill="#176c68" text-anchor="start">+20,3</text><text x="765" y="409" font-size="18" font-weight="normal" fill="#1c3240" text-anchor="start">điểm phần trăm</text><line x1="145.0" x2="145.0" y1="465" y2="471" stroke="#667681"/><text x="145.0" y="496" font-size="17" font-weight="normal" fill="#1c3240" text-anchor="middle">0%</text><line x1="277.5" x2="277.5" y1="465" y2="471" stroke="#667681"/><text x="277.5" y="496" font-size="17" font-weight="normal" fill="#1c3240" text-anchor="middle">10%</text><line x1="410.0" x2="410.0" y1="465" y2="471" stroke="#667681"/><text x="410.0" y="496" font-size="17" font-weight="normal" fill="#1c3240" text-anchor="middle">20%</text><line x1="542.5" x2="542.5" y1="465" y2="471" stroke="#667681"/><text x="542.5" y="496" font-size="17" font-weight="normal" fill="#1c3240" text-anchor="middle">30%</text><line x1="675.0" x2="675.0" y1="465" y2="471" stroke="#667681"/><text x="675.0" y="496" font-size="17" font-weight="normal" fill="#1c3240" text-anchor="middle">40%</text><text x="28" y="543" font-size="18" font-weight="normal" fill="#1c3240" text-anchor="start">Lượt thuê đã ghi nhận; không phải nhu cầu thiếu xe hay tác động của quan sát.</text><text x="28" y="571" font-size="17" font-weight="normal" fill="#1c3240" text-anchor="start">Giả định lập lịch: hr là giờ bắt đầu ô. Cần xác nhận ý nghĩa và giờ địa phương trước triển khai.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123" role="img" aria-labelledby="title desc">
<title id="title">Chưa đủ bằng chứng để nhân rộng coaching của B</title>
<desc id="desc">Dữ liệu giả lập. Gộp toàn bộ lead: A 30%, B 45%. B có 75% lead High, A có 25%. Trong High: A 60%, B 55%; trong Low: A 20%, B 15%. Cùng cơ cấu 50% High và 50% Low: A 40%, B 35%. Thiếu thời gian quan sát và việc phân coaching nên chưa xác định được tác động. Đề xuất thử nghiệm có đối chứng trước khi nhân rộng. Số chính xác trong memo.md và calculations.json.</desc>
<rect x="0" y="0" width="794" height="1123" fill="#FCFBF8"/>
<text x="48" y="49" fill="#136D69" font-family="Arial, sans-serif" font-size="13.3" font-weight="700" text-anchor="start">RÀ SOÁT KẾT LUẬN SALES  |  DỮ LIỆU GIẢ LẬP</text>
<text x="48" y="99" fill="#172A2B" font-family="Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start">Chưa đủ bằng chứng</text>
<text x="48" y="142" fill="#172A2B" font-family="Arial, sans-serif" font-size="35" font-weight="700" text-anchor="start">để nhân rộng coaching của B</text>
<text x="48" y="181" fill="#172A2B" font-family="Arial, sans-serif" font-size="17.5" font-weight="400" text-anchor="start">B cao hơn khi gộp lead, nhưng thấp hơn A trong từng nhóm.</text>
<text x="48" y="216" fill="#4D6061" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">CSV không có thời gian quan sát hoặc cách phân coaching;</text>
<text x="48" y="238" fill="#4D6061" font-family="Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start">+50% là chênh lệch tỷ lệ gộp, chưa phải hiệu quả coaching.</text>
<line x1="48" y1="260" x2="746" y2="260" stroke="#D2DCDC" stroke-width="1"/>
<text x="48" y="293" fill="#172A2B" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Cùng cơ cấu lead, thứ hạng đảo chiều</text>
<text x="48" y="327" fill="#172A2B" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Gộp theo cơ cấu thực tế</text>
<text x="416" y="327" fill="#172A2B" font-family="Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Chuẩn hóa cùng cơ cấu lead</text>
<text x="48" y="351" fill="#4D6061" font-family="Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">B cao hơn 15 điểm % (+50% so với A)</text>
<text x="416" y="351" fill="#136D69" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="start">B thấp hơn 5 điểm %</text>
<line x1="76.0" y1="372" x2="76.0" y2="453" stroke="#D2DCDC" stroke-width="0.7"/>
<text x="76.0" y="477" fill="#4D6061" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">0%</text>
<line x1="152.0" y1="372" x2="152.0" y2="453" stroke="#D2DCDC" stroke-width="0.7"/>
<text x="152.0" y="477" fill="#4D6061" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">20%</text>
<line x1="228.0" y1="372" x2="228.0" y2="453" stroke="#D2DCDC" stroke-width="0.7"/>
<text x="228.0" y="477" fill="#4D6061" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">40%</text>
<line x1="304.0" y1="372" x2="304.0" y2="453" stroke="#D2DCDC" stroke-width="0.7"/>
<text x="304.0" y="477" fill="#4D6061" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">60%</text>
<line x1="76" y1="453" x2="304" y2="453" stroke="#4D6061" stroke-width="0.8"/>
<line x1="444.0" y1="372" x2="444.0" y2="453" stroke="#D2DCDC" stroke-width="0.7"/>
<text x="444.0" y="477" fill="#4D6061" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">0%</text>
<line x1="520.0" y1="372" x2="520.0" y2="453" stroke="#D2DCDC" stroke-width="0.7"/>
<text x="520.0" y="477" fill="#4D6061" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">20%</text>
<line x1="596.0" y1="372" x2="596.0" y2="453" stroke="#D2DCDC" stroke-width="0.7"/>
<text x="596.0" y="477" fill="#4D6061" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">40%</text>
<line x1="672.0" y1="372" x2="672.0" y2="453" stroke="#D2DCDC" stroke-width="0.7"/>
<text x="672.0" y="477" fill="#4D6061" font-family="Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle">60%</text>
<line x1="444" y1="453" x2="672" y2="453" stroke="#4D6061" stroke-width="0.8"/>
<text x="61" y="390" fill="#314A4D" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="end">A</text>
<rect x="76" y="371" width="114.0" height="22" fill="#314A4D"/>
<text x="198.0" y="389" fill="#314A4D" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="start">30% · 24/80</text>
<text x="61" y="434" fill="#136D69" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="end">B</text>
<rect x="76" y="415" width="171.0" height="22" fill="#136D69"/>
<text x="255.0" y="433" fill="#136D69" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="start">45% · 36/80</text>
<text x="429" y="390" fill="#314A4D" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="end">A</text>
<rect x="444" y="371" width="152.00000000000003" height="22" fill="#314A4D"/>
<text x="604.0" y="389" fill="#314A4D" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="start">40%</text>
<text x="429" y="434" fill="#136D69" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="end">B</text>
<rect x="444" y="415" width="133.0" height="22" fill="#136D69"/>
<text x="585.0" y="433" fill="#136D69" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="start">35%</text>
<text x="48" y="505" fill="#4D6061" font-family="Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">A và B: mỗi bên 80 lead</text>
<text x="48" y="527" fill="#172A2B" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="start">Lead High: A 25% | B 75%</text>
<text x="416" y="505" fill="#172A2B" font-family="Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="start">50% High + 50% Low cho cả hai</text>
<text x="416" y="527" fill="#4D6061" font-family="Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="start">Từ 160 lead: 80 High, 80 Low</text>
<text x="48" y="553" fill="#4D6061" font-family="Arial, sans-serif" font-size="14.3" font-weight="400" text-anchor="start">Tỷ lệ chuẩn hóa dùng để so sánh; không phải số chốt mới quan sát.</text>
<line x1="48" y1="573" x2="746" y2="573" stroke="#D2DCDC" stroke-width="1"/>
<text x="48" y="607" fill="#172A2B" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">Kiểm lại từng nhóm lead</text>
<text x="48" y="640" fill="#4D6061" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">Nhóm lead</text>
<text x="290" y="640" fill="#314A4D" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">A: chốt / lead</text>
<text x="482" y="640" fill="#136D69" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">B: chốt / lead</text>
<text x="746" y="640" fill="#4D6061" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end">B - A</text>
<line x1="48" y1="651" x2="746" y2="651" stroke="#D2DCDC" stroke-width="1"/>
<text x="48" y="677" fill="#172A2B" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">High</text>
<text x="290" y="677" fill="#314A4D" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">12/20 = 60%</text>
<text x="482" y="677" fill="#136D69" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">33/60 = 55%</text>
<text x="746" y="677" fill="#172A2B" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" text-anchor="end">-5 điểm %</text>
<text x="48" y="716" fill="#172A2B" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">Low</text>
<text x="290" y="716" fill="#314A4D" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">12/60 = 20%</text>
<text x="482" y="716" fill="#136D69" font-family="Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start">3/20 = 15%</text>
<text x="746" y="716" fill="#172A2B" font-family="Arial, sans-serif" font-size="15.5" font-weight="700" text-anchor="end">-5 điểm %</text>
<line x1="48" y1="732" x2="746" y2="732" stroke="#D2DCDC" stroke-width="1"/>
<text x="48" y="758" fill="#172A2B" font-family="Arial, sans-serif" font-size="15.2" font-weight="700" text-anchor="start">Với mọi cơ cấu High/Low chung, B đều thấp hơn A 5 điểm %.</text>
<rect x="48" y="790" width="698" height="204" fill="#EAF2F0"/>
<text x="68" y="823" fill="#172A2B" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="start">Quyết định đề xuất: kiểm thử trước khi nhân rộng</text>
<text x="68" y="853" fill="#172A2B" font-family="Arial, sans-serif" font-size="14.8" font-weight="400" text-anchor="start">• Trưởng nhóm đề xuất chia ngẫu nhiên nhân sự A: coaching B /</text>
<text x="68" y="876" fill="#172A2B" font-family="Arial, sans-serif" font-size="14.8" font-weight="400" text-anchor="start">  đối chứng; cân bằng High/Low giữa hai nhóm. Chưa triển khai đại trà.</text>
<text x="68" y="899" fill="#172A2B" font-family="Arial, sans-serif" font-size="14.8" font-weight="400" text-anchor="start">• Chốt số mẫu, thời gian đủ để lead chốt, chi phí, ngưỡng cải thiện</text>
<text x="68" y="922" fill="#172A2B" font-family="Arial, sans-serif" font-size="14.8" font-weight="400" text-anchor="start">  và quy tắc dừng trước khi bắt đầu.</text>
<text x="68" y="945" fill="#172A2B" font-family="Arial, sans-serif" font-size="14.8" font-weight="400" text-anchor="start">• Chỉ nhân rộng khi lợi ích đạt ngưỡng đã thống nhất, với độ bất định</text>
<text x="68" y="968" fill="#172A2B" font-family="Arial, sans-serif" font-size="14.8" font-weight="400" text-anchor="start">  chấp nhận được.</text>
<text x="48" y="1030" fill="#4D6061" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Nguồn: data.csv · 4 dòng · 160 lead · tỷ lệ chốt = wins / eligible_leads.</text>
<text x="48" y="1052" fill="#4D6061" font-family="Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start">Dữ liệu giả lập. CSV chưa định nghĩa High/Low; giữ nguyên nhãn nguồn.</text>
<line x1="48" y1="1070" x2="746" y2="1070" stroke="#D2DCDC" stroke-width="1"/>
<text x="48" y="1095" fill="#4D6061" font-family="Arial, sans-serif" font-size="11.8" font-weight="700" text-anchor="start">TÀI LIỆU HỌP  |  BẢN SỬA KẾT LUẬN</text>
<text x="746" y="1095" fill="#4D6061" font-family="Arial, sans-serif" font-size="12" font-weight="400" text-anchor="end">1 / 1</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">Lead mix changes the ranking.</title><desc id="desc">B has the higher overall win rate, 45% versus 30%. A has a five percentage point higher rate in each supplied lead tier. Different lead mix explains the ranking reversal; no coaching effect is identified.</desc>

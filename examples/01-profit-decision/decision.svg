<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080" role="img" aria-labelledby="title desc">
<title id="title">More sales. Less contribution.</title><desc id="desc">June to July contribution falls from 35.00 to 30.95 million VND. Volume and mix add 10.90; invoice prices reduce 6.40; posted credits reduce 1.70; freight reduces 6.85. Three million freight is not attributed by the connector.</desc>

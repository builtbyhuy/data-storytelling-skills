<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Freight growth erased the gain in gross profit.</title><desc id="desc">June to July 2026: gross profit rose 2.80 million VND and freight rose 6.85 million VND. Contribution fell 4.05 million, from 35.00 to 30.95. Closed-ledger freight is authoritative; 3.00 million is unattributed.</desc>

<text class="number" x="1336" y="66" font-size="18" fill="#52636A" font-weight="400" text-anchor="end">DECISION NOTE 01  /  SYNTHETIC EXAMPLE</text>
<line x1="64" y1="91" x2="1336" y2="91" stroke="#D7DEDA" stroke-width="1"/>
<text class="number" x="64" y="167" font-size="66" fill="#182D33" font-weight="650" text-anchor="start">More sales.</text>
<text class="number" x="64" y="243" font-size="66" fill="#182D33" font-weight="650" text-anchor="start">Less contribution.</text>
<text class="number" x="64" y="292" font-size="28" fill="#52636A" font-weight="400" text-anchor="start">Explain the decline before choosing the August move.</text>

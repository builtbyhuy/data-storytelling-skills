<text x="106" y="46" font-size="13" fill="#5B6874" font-weight="600" text-anchor="start" letter-spacing="1.4">WORKED EXAMPLE</text>
<text x="1370" y="46" font-size="13" fill="#5B6874" font-weight="400" text-anchor="end" letter-spacing="1.2">SYNTHETIC DATA</text>

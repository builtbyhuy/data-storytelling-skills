<text class="heading" x="70" y="132" font-size="42" fill="#17252E" font-weight="400" text-anchor="start">Freight growth erased the gain in gross profit.</text>
<text x="70" y="176" font-size="21" fill="#5B6874" font-weight="400" text-anchor="start">Contribution fell 4.05m VND from June to July 2026, despite higher sales.</text>

<rect x="990" y="335" width="346" height="491" fill="#E7EEE8" rx="10"/>
<text class="number" x="1018" y="377" font-size="27" fill="#182D33" font-weight="650" text-anchor="start">Keep B2B in the plan.</text>
<text class="number" x="1018" y="421" font-size="23" fill="#182D33" font-weight="400" text-anchor="start">Even assigning all missing</text>
<text class="number" x="1018" y="452" font-size="23" fill="#182D33" font-weight="400" text-anchor="start">freight to B2B leaves</text>
<text class="number" x="1018" y="522" font-size="57" fill="#08766A" font-weight="650" text-anchor="start">17.70m</text>
<text class="number" x="1018" y="557" font-size="24" fill="#182D33" font-weight="400" text-anchor="start">positive contribution.</text>
<line x1="1018" y1="590" x2="1308" y2="590" stroke="#C1CEC5" stroke-width="1"/>
<text class="number" x="1018" y="630" font-size="23" fill="#182D33" font-weight="650" text-anchor="start">Coverage changes the story.</text>
<text class="number" x="1018" y="670" font-size="22" fill="#182D33" font-weight="400" text-anchor="start">Carrier detail: 12.70m</text>
<text class="number" x="1018" y="701" font-size="22" fill="#182D33" font-weight="400" text-anchor="start">Closed ledger: 15.70m</text>
<text class="number" x="1018" y="732" font-size="22" fill="#182D33" font-weight="400" text-anchor="start">The 3.00m gap is real;</text>
<text class="number" x="1018" y="763" font-size="22" fill="#182D33" font-weight="400" text-anchor="start">its attribution is unknown.</text>
<text class="number" x="64" y="850" font-size="22" fill="#52636A" font-weight="400" text-anchor="start">Gross profit rose 2.80m. Freight rose 6.85m. The ledger sets the total.</text>
<rect x="64" y="885" width="1272" height="125" fill="#182D33" rx="8"/>
<text class="number" x="92" y="931" font-size="34" fill="#FFFFFF" font-weight="650" text-anchor="start">Test a smaller discount. Keep B2B.</text>
<text class="number" x="92" y="965" font-size="22" fill="#E8EFED" font-weight="400" text-anchor="start">Use comparable customers and measure contribution after credits and freight.</text>
<text class="number" x="92" y="994" font-size="22" fill="#E8EFED" font-weight="400" text-anchor="start">The 6.20m price-restoration scenario holds quantity fixed; it is not a demand forecast.</text>
<text class="number" x="64" y="1045" font-size="18" fill="#52636A" font-weight="400" text-anchor="start">Source: supplied June/July exports + closed ledger. Curated illustration; no action has been run.</text>

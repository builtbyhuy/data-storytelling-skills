<text x="798" y="791" font-size="20" fill="#17252E" font-weight="400" text-anchor="start">3.00m freight is in the ledger but unattributed.</text>
<line x1="70" y1="817" x2="1370" y2="817" stroke="#DFE5EA" stroke-width="1"/>
<text x="70" y="850" font-size="16" fill="#5B6874" font-weight="400" text-anchor="start">Source: June/July invoice, credit and finance exports. July ledger freight 15.70m; carrier detail 12.70m.</text>
<text x="70" y="875" font-size="16" fill="#5B6874" font-weight="400" text-anchor="start">Proposed commercial-lead pilot: four-week execution review; expansion waits for complete return and freight evidence.</text>

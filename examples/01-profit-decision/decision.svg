<text class="number" x="64" y="358" font-size="27" fill="#182D33" font-weight="650" text-anchor="start">The contribution bridge</text>
<text class="number" x="64" y="388" font-size="20" fill="#52636A" font-weight="400" text-anchor="start">June → July 2026 · million VND · contribution excludes overhead</text>

<text x="36" y="619" fill="#9B432A" font-family="Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start">Cước tháng 7 còn 3,00 triệu chưa gán nhóm. Nếu đều thuộc B2B, mức thay đổi của B2B là -1,20 triệu. Đó chưa phải</text>
<text x="36" y="633" fill="#9B432A" font-family="Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start">toàn bộ đóng góp nhóm.</text>
<line x1="36" y1="652" x2="559.276" y2="652" stroke="#192F40" stroke-width="0.8"/>
<text x="36" y="676" fill="#192F40" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start">QUYẾT TẠI CUỘC HỌP</text>
<text x="36" y="696" fill="#192F40" font-family="Arial, sans-serif" font-size="10.3" font-weight="400" text-anchor="start">Đề xuất thử 4 tuần với đơn B2B có hạn giao phù hợp giao tiêu chuẩn, cùng nhóm giữ hiện trạng. Chỉ mở sau đối</text>
<text x="36" y="710" fill="#192F40" font-family="Arial, sans-serif" font-size="10.3" font-weight="400" text-anchor="start">soát 3 triệu cước và xác nhận hạn giao.</text>
<text x="36" y="740" fill="#192F40" font-family="Arial, sans-serif" font-size="9.2" font-weight="700" text-anchor="start">Ai chịu trách nhiệm</text>
<text x="36" y="755.0" fill="#4C606D" font-family="Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start">Chủ DN duyệt/giữ/dừng; giao hàng thực hiện; kế toán chốt</text>
<text x="36" y="767.4" fill="#4C606D" font-family="Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start">nguồn. Vai trò là đề xuất. Tối đa 60 yêu cầu đặt hàng đủ</text>
<text x="36" y="779.8" fill="#4C606D" font-family="Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start">điều kiện; trần chi phí thêm 1 triệu.</text>
<text x="310" y="740" fill="#192F40" font-family="Arial, sans-serif" font-size="9.2" font-weight="700" text-anchor="start">Giới hạn và cách đọc</text>
<text x="310" y="755.0" fill="#4C606D" font-family="Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start">Dừng khi đổi dịch vụ làm trễ cam kết. Chỉ giữ thử nhỏ nếu</text>
<text x="310" y="767.4" fill="#4C606D" font-family="Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start">đóng góp tăng ≥5.000 VND/yêu cầu đặt hàng, sau đủ giảm</text>
<text x="310" y="779.8" fill="#4C606D" font-family="Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start">trừ, cước và chi phí thử; không hại nhu cầu.</text>
<text x="36" y="812" fill="#4C606D" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start">Đề xuất chưa phê duyệt. Đọc sau yêu cầu cuối ≥14 ngày và nguồn đủ; xem test-plan.md.</text>
<text x="36" y="826" fill="#4C606D" font-family="Arial, sans-serif" font-size="8.2" font-weight="400" text-anchor="start">Nguồn: tài chính khóa sổ; hóa đơn và giảm trừ theo ngày ghi sổ; cước theo tháng dịch vụ.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 374" role="img" aria-labelledby="attempts-desktop-title attempts-desktop-desc"><title id="attempts-desktop-title">Tỷ lệ đăng ký theo số lần liên lạc trong chiến dịch</title><desc id="attempts-desktop-desc">1 lần: 14,6%; 2 đến 3 lần: 11,2%; 4 đến 6 lần: 8,3%; từ 7 lần: 5,3%. Không thể suy ra gọi thêm làm giảm đăng ký vì số lần được ghi khi chiến dịch đã diễn ra.</desc><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#243c45;font-size:23px}.small{font-size:19px;fill:#546870}.tick{font-size:19px;fill:#546870}</style><line x1="245.0" x2="245.0" y1="36" y2="316" stroke="#d7e0e1"/><text class="tick" x="245.0" y="347" text-anchor="middle">0%</text><line x1="392.5" x2="392.5" y1="36" y2="316" stroke="#d7e0e1"/><text class="tick" x="392.5" y="347" text-anchor="middle">5%</text><line x1="540.0" x2="540.0" y1="36" y2="316" stroke="#d7e0e1"/><text class="tick" x="540.0" y="347" text-anchor="middle">10%</text><line x1="687.5" x2="687.5" y1="36" y2="316" stroke="#d7e0e1"/><text class="tick" x="687.5" y="347" text-anchor="middle">15%</text><line x1="835.0" x2="835.0" y1="36" y2="316" stroke="#d7e0e1"/><text class="tick" x="835.0" y="347" text-anchor="middle">20%</text><line x1="590.1051735197186" x2="590.1051735197186" y1="36" y2="316" stroke="#546870" stroke-width="2" stroke-dasharray="5 5"/><text x="223" y="69" text-anchor="end">1 lần</text><rect x="245" y="52" width="430.6287049703602" height="27" rx="2" fill="#006b61"/><text x="684.6287049703602" y="72" font-weight="650">14,6%</text><rect x="243" y="83" width="689" height="25" fill="#fffdf9"/><text class="small" x="245" y="100">2.561 yes / 17.544 hồ sơ</text><text x="223" y="135" text-anchor="end">2–3 lần</text><rect x="245" y="118" width="330.4144014201709" height="27" rx="2" fill="#5e7985"/><text x="584.4144014201709" y="138" font-weight="650">11,2%</text><rect x="243" y="149" width="689" height="25" fill="#fffdf9"/><text class="small" x="245" y="166">2.019 yes /
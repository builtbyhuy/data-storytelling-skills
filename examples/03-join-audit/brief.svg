<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 595.276 841.89" role="img" aria-labelledby="title desc">
<title id="title">Giá trị hóa đơn là 1.200 USD; phép nối thô đếm lặp</title>
<desc id="desc">INV-1002 có hai dòng hóa đơn 450 và 50 USD, ba khoản thu 250, 150, 100 USD. Sáu tổ hợp nối làm doanh thu 500 thành 1.500 USD. Tổng cộng lặp 1.300 USD; nối trong còn bỏ 150 USD chưa trả và báo 2.350. Bảng đúng giữ bốn hóa đơn: doanh thu 1.200, thu 1.050, còn 150 USD. Chi tiết có trong invoice-reconciliation.csv và memo.md.</desc>
<rect width="595.276" height="841.89" fill="white"/>
<text x="40" y="43" font-family="Arial, sans-serif" font-size="9" fill="#4C626D" font-weight="700" text-anchor="start">BẢN SOẠN NỘI BỘ  /  DỮ LIỆU GIẢ LẬP</text>
<text x="40" y="78" font-family="Arial, sans-serif" font-size="22" fill="#173342" font-weight="700" text-anchor="start">Giá trị hóa đơn: 1.200 USD.</text>
<text x="40" y="105" font-family="Arial, sans-serif" font-size="22" fill="#173342" font-weight="700" text-anchor="start">Phép nối thô đã đếm lặp tiền.</text>
<text x="40" y="130" font-family="Arial, sans-serif" font-size="9.2" fill="#4C626D" font-weight="400" text-anchor="start">4 hóa đơn · cùng mốc chốt theo nguồn · USD · giá trị hóa đơn sau giảm giá, chưa thuế</text>
<text x="40" y="166" font-family="Arial, sans-serif" font-size="12" fill="#173342" font-weight="700" text-anchor="start">01   INV-1002: hai dòng hóa đơn, ba khoản thu, sáu tổ hợp</text>
<rect x="40" y="184" width="515" height="144" fill="#F6F8F7"/>
<text x="56" y="207" font-family="Arial, sans-serif" font-size="8.4" fill="#4C626D" font-weight="700" text-anchor="start">MỖI CỘT LÀ MỘT KHOẢN THU</text>

<text x="378" y="292" font-family="Arial, sans-serif" font-size="14" fill="#7C4614" font-weight="700" text-anchor="start">Dư 1.000 USD</text>
<text x="40" y="347" font-family="Arial, sans-serif" font-size="10" fill="#173342" font-weight="400" text-anchor="start">INV-1001 cũng lặp: 300 thành 600 USD, dư 300. Tổng phần lặp: 1.300 USD.</text>
<text x="40" y="382" font-family="Arial, sans-serif" font-size="12" fill="#173342" font-weight="700" text-anchor="start">02   Chỉ giữ hóa đơn có khoản thu sẽ bỏ INV-1004</text>

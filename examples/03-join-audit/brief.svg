<text x="40" y="453" font-family="Arial, sans-serif" font-size="9.1" fill="#4C626D" font-weight="400" text-anchor="start">Ghép thô và giữ mọi hóa đơn: 2.500 USD. Tiền thu cả hai cách: 1.850 thay vì 1.050 USD.</text>

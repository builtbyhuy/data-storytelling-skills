<text x="70" y="850" font-size="16" fill="#5B6874" font-weight="400" text-anchor="start">All four invoices (USD): $1,200 billed · $1,050 received · $150 unpaid. Raw left-join revenue: $2,500.</text>
<text x="70" y="875" font-size="16" fill="#5B6874" font-weight="400" text-anchor="start">Source: executed synthetic join audit. Many-to-many cardinality passes; that does not make revenue additive.</text>

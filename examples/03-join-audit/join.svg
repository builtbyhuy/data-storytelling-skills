<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">One invoice. Counted three times.</title><desc id="desc">Invoice INV-1002 has two legitimate lines totaling 500 USD and three payment allocations. A raw join carries the 500 revenue into each allocation, producing 1500 and 1000 duplication. Across all invoices duplication is 1300 USD.</desc>

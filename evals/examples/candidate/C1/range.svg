<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img"><title>Khoảng phản hồi Basic 20–55, Standard 45–90, Complex 80–150 phút</title><desc>Ba thanh nổi thể hiện low tới high. Không có phần thanh từ 0 tới low. Định nghĩa thống kê của khoảng chưa được cung cấp.</desc><g font-family="Arial, sans-serif"><rect width="1000" height="620" fill="white"/><text x="52" y="57" font-size="30" font-weight="bold" fill="#17324d" text-anchor="start">Khoảng thời gian phản hồi theo hàng đợi</text><text x="52" y="96" font-size="20" font-weight="normal" fill="#526578" text-anchor="start">Đầu trái = low_minutes · đầu phải = high_minutes · đơn vị: phút</text><line x1="200.0" y1="166" x2="200.0" y2="449" stroke="#ccd5dc"/><text x="200.0" y="483" font-size="18" font-weight="normal" fill="#526578" text-anchor="middle">0</text><line x1="287.0" y1="166" x2="287.0" y2="449" stroke="#ccd5dc"/><text x="287.0" y="483" font-size="18" font-weight="normal" fill="#526578" text-anchor="middle">20</text><line x1="374.0" y1="166" x2="374.0" y2="449" stroke="#ccd5dc"/><text x="374.0" y="483" font-size="18" font-weight="normal" fill="#526578" text-anchor="middle">40</text><line x1="461.0" y1="166" x2="461.0" y2="449" stroke="#ccd5dc"/><text x="461.0" y="483" font-size="18" font-weight="normal" fill="#526578" text-anchor="middle">60</text><line x1="548.0" y1="166" x2="548.0" y2="449" stroke="#ccd5dc"/><text x="548.0" y="483" font-size="18" font-weight="normal" fill="#526578" text-anchor="middle">80</text><line x1="635.0" y1="166" x2="635.0" y2="449" stroke="#ccd5dc"/><text x="635.0" y="483" font-size="18" font-weight="normal" fill="#526578" text-anchor="middle">100</text><line x1="722.0" y1="166" x2="722.0" y2="449" stroke="#ccd5dc"/><text x="722.0" y="483" font-size="18" font-weight="normal" fill="#526578" text-anchor="middle">120</text><line x1="809.0" y1="166" x2="809.0" y2="449" stroke="#ccd5dc"/><text x="809.0" y="483" font-size="18" font-weight="normal" fill="#526578" text-anchor="middle">140</text><line x1="896.0" y1="166" x2="896.0" y2="449" stroke="#ccd5dc"/><text x="896.0" y="483" font-size="18" font-weight="normal" fill="#526578" text-anchor="middle">160</text><text x="52" y="225" font-size="24" font-weight="bold" fill="#17324d" text-anchor="start">Basic</text><rect class="range" data-queue="Basic" data-low="20.0" data-high="55.0" x="287.0" y="204" width="152.25" height="24" fill="#167468"/><line x1="287.0" y1="197" x2="287.0" y2="235" stroke="#17324d" stroke-width="3"/><line x1="439.25" y1="197" x2="439.25" y2="235" stroke="#17324d" stroke-width="3"/><text x="287.0" y="183" font-size="21" font-weight="bold" fill="#17324d" text-anchor="middle">20</text><text x="439.25" y="183" font-size="21" font-weight="bold" fill="#17324d" text-anchor="middle">55</text><text x="52" y="318" font-size="24" font-weight="bold" fill="#17324d" text-anchor="start">Standard</text><rect class="range" data-queue="Standard" data-low="45.0" data-high="90.0" x="395.75" y="297" width="195.75" height="24" fill="#167468"/><line x1="395.75" y1="290" x2="395.75" y2="328" stroke="#17324d" stroke-width="3"/><line x1="591.5" y1="290" x2="591.5" y2="328" stroke="#17324d" stroke-width="3"/><text x="395.75" y="276" font-size="21" font-weight="bold" fill="#17324d" text-anchor="middle">45</text><text x="591.5" y="276" font-size="21" font-weight="bold" fill="#17324d" text-anchor="middle">90</text><text x="52" y="411" font-size="24" font-weight="bold" fill="#17324d" text-anchor="start">Complex</text><rect class="range" data-queue="Complex" data-low="80.0" data-high="150.0" x="548.0" y="390" width="304.5" height="24" fill="#167468"/><line x1="548.0" y1="383" x2="548.0" y2="421" stroke="#17324d" stroke-width="3"/><line x1="852.5" y1="383" x2="852.5" y2="421" stroke="#17324d" stroke-width="3"/><text x="548.0" y="369" font-size="21" font-weight="bold" fill="#17324d" text-anchor="middle">80</text><text x="852.5" y="369" font-size="21" font-weight="bold" fill="#17324d" text-anchor="middle">150</text><text x="548" y="519" font-size="21" font-weight="normal" fill="#17324d" text-anchor="middle">Thời gian phản hồi (phút)</text><text x="52" y="566" font-size="19" font-weight="normal" fill="#526578" text-anchor="start">Nguồn: ranges.csv · Thanh chỉ thể hiện đoạn low → high; không cộng từ 0.</text><text x="52" y="596" font-size="18" font-weight="normal" fill="#526578" text-anchor="start">Chưa có định nghĩa thống kê/kỳ đo của các khoảng; không coi là khoảng tin cậy hay SLA.</text></g></svg>
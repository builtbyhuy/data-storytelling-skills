<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img"><title>Tỷ lệ thắng theo đội và tầng lead</title><desc>A tổng 30%, B 45%; A cao hơn trong mỗi tầng. Giả định cơ cấu 50/50: A 40%, B 35%. Chưa có bằng chứng coaching.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="920" fill="white"/><text x="56" y="58" font-size="31" fill="#17324d" font-weight="bold" text-anchor="start">Tỷ lệ chung chưa đủ để chọn coaching của đội B</text><text x="56" y="97" font-size="21" fill="#526578" font-weight="normal" text-anchor="start">Dữ liệu cung cấp: thắng / lead đủ điều kiện · kỳ đo chưa được nêu</text><rect x="946" y="127" width="19" height="16" fill="#17324d"/><text x="974" y="144" font-size="18" fill="#17324d" font-weight="normal" text-anchor="start">Đội A</text><rect x="1052" y="127" width="19" height="16" fill="#167468"/><text x="1080" y="144" font-size="18" fill="#17324d" font-weight="normal" text-anchor="start">Đội B</text><line x1="350" y1="169" x2="350" y2="650" stroke="#ccd5dc" stroke-width="1"/><text x="350" y="687" font-size="17" fill="#526578" font-weight="normal" text-anchor="middle">0%</text><line x1="440" y1="169" x2="440" y2="650" stroke="#ccd5dc" stroke-width="1"/><text x="440" y="687" font-size="17" fill="#526578" font-weight="normal" text-anchor="middle">10%</text><line x1="530" y1="169" x2="530" y2="650" stroke="#ccd5dc" stroke-width="1"/><text x="530" y="687" font-size="17" fill="#526578" font-weight="normal" text-anchor="middle">20%</text><line x1="620" y1="169" x2="620" y2="650" stroke="#ccd5dc" stroke-width="1"/><text x="620" y="687" font-size="17" fill="#526578" font-weight="normal" text-anchor="middle">30%</text><line x1="710" y1="169" x2="710" y2="650" stroke="#ccd5dc" stroke-width="1"/><text x="710" y="687" font-size="17" fill="#526578" font-weight="normal" text-anchor="middle">40%</text><line x1="800" y1="169" x2="800" y2="650" stroke="#ccd5dc" stroke-width="1"/><text x="800" y="687" font-size="17" fill="#526578" font-weight="normal" text-anchor="middle">50%</text><line x1="890" y1="169" x2="890" y2="650" stroke="#ccd5dc" stroke-width="1"/><text x="890" y="687" font-size="17" fill="#526578" font-weight="normal" text-anchor="middle">60%</text><line x1="980" y1="169" x2="980" y2="650" stroke="#ccd5dc" stroke-width="1"/><text x="980" y="687" font-size="17" fill="#526578" font-weight="normal" text-anchor="middle">70%</text><text x="56" y="221" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">Tổng quan sát</text><text x="56" y="249" font-size="18" fill="#526578" font-weight="normal" text-anchor="start">High: A 25% / B 75%</text><rect x="350" y="193" width="270" height="24" fill="#17324d"/><text x="632" y="212" font-size="19" fill="#17324d" font-weight="bold" text-anchor="start">30% · 24/80</text><rect x="350" y="227" width="405" height="24" fill="#167468"/><text x="767" y="246" font-size="19" fill="#167468" font-weight="bold" text-anchor="start">45% · 36/80</text><text x="56" y="339" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">Lead High</text><rect x="350" y="311" width="540" height="24" fill="#17324d"/><text x="902" y="330" font-size="19" fill="#17324d" font-weight="bold" text-anchor="start">60% · 12/20</text><rect x="350" y="345" width="495" height="24" fill="#167468"/><text x="857" y="364" font-size="19" fill="#167468" font-weight="bold" text-anchor="start">55% · 33/60</text><text x="56" y="457" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">Lead Low</text><rect x="350" y="429" width="180" height="24" fill="#17324d"/><text x="542" y="448" font-size="19" fill="#17324d" font-weight="bold" text-anchor="start">20% · 12/60</text><rect x="350" y="463" width="135" height="24" fill="#167468"/><text x="497" y="482" font-size="19" fill="#167468" font-weight="bold" text-anchor="start">15% · 3/20</text><text x="56" y="575" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">Cùng cơ cấu 50/50</text><text x="56" y="603" font-size="18" fill="#526578" font-weight="normal" text-anchor="start">50% High + 50% Low</text><rect x="350" y="547" width="360" height="24" fill="#17324d"/><text x="722" y="566" font-size="19" fill="#17324d" font-weight="bold" text-anchor="start">40% · giả định</text><rect x="350" y="581" width="315" height="24" fill="#167468"/><text x="677" y="600" font-size="19" fill="#167468" font-weight="bold" text-anchor="start">35% · giả định</text><rect x="56" y="729" width="1088" height="86" fill="#eef3f6"/><text x="75" y="760" font-size="23" fill="#17324d" font-weight="bold" text-anchor="start">A cao hơn 5 điểm % ở cả hai tầng; B có nhiều lead High hơn.</text><text x="75" y="794" font-size="21" fill="#17324d" font-weight="normal" text-anchor="start">Đề xuất: kiểm tra phân lead, rồi pilot có đối chứng; chưa triển khai coaching.</text><text x="56" y="855" font-size="18" fill="#526578" font-weight="normal" text-anchor="start">Nguồn: team.csv · Chuẩn hóa 50/50 là mô tả giả định, không phải hiệu quả can thiệp.</text><text x="56" y="887" font-size="18" fill="#526578" font-weight="normal" text-anchor="start">Thiếu cách phân lead, kỳ đo và dữ liệu coaching; chưa thể kết luận đội nào có kỹ năng tốt hơn.</text></g></svg>
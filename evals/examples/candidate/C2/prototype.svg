<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img"><title>Bản mẫu bố cục doanh thu tuần với dữ liệu chưa biết</title><desc>Chỉ giữ nhãn Week 1 và Week 2 và quan sát cột tuần 2 cao hơn trong ảnh. Hai trường giá trị chính xác đều chưa biết; không có cột hay chiều dài mã hóa số liệu.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="770" fill="white" stroke="none" rx="0"/><rect x="56" y="37" width="480" height="34" fill="#eef3f6" stroke="none" rx="4"/><text x="73" y="61" font-size="17" font-weight="bold" fill="#17324d" text-anchor="start">BẢN MẪU BỐ CỤC · CHƯA CÓ SỐ CHÍNH XÁC</text><text x="56" y="119" font-size="34" font-weight="bold" fill="#17324d" text-anchor="start">Ảnh gợi ý Week 2 cao hơn Week 1</text><text x="56" y="158" font-size="22" font-weight="normal" fill="#526578" text-anchor="start">Weekly net revenue · M VND (triệu đồng) · thông tin đọc được từ ảnh</text><rect x="56" y="203" width="1088" height="294" fill="#f5f8fa" stroke="none" rx="6"/><text x="82" y="244" font-size="18" font-weight="bold" fill="#526578" text-anchor="start">DỮ LIỆU CHỜ XÁC NHẬN — CÁC Ô KHÔNG MÃ HÓA GIÁ TRỊ</text><text x="100" y="293" font-size="19" font-weight="normal" fill="#526578" text-anchor="start">Nhãn trong ảnh</text><text x="457" y="293" font-size="19" font-weight="normal" fill="#526578" text-anchor="start">Giá trị chính xác</text><text x="890" y="293" font-size="19" font-weight="normal" fill="#526578" text-anchor="start">Kỳ ngày / phạm vi</text><rect x="82" y="321" width="1035" height="59" fill="white" stroke="none" rx="4"/><text x="101" y="359" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">Week 1</text><text x="457" y="359" font-size="26" font-weight="bold" fill="#17324d" text-anchor="start">CHƯA BIẾT</text><text x="890" y="359" font-size="23" font-weight="normal" fill="#17324d" text-anchor="start">Chưa biết</text><rect x="82" y="401" width="1035" height="59" fill="white" stroke="none" rx="4"/><text x="101" y="439" font-size="27" font-weight="bold" fill="#17324d" text-anchor="start">Week 2</text><text x="457" y="439" font-size="26" font-weight="bold" fill="#17324d" text-anchor="start">CHƯA BIẾT</text><text x="890" y="439" font-size="23" font-weight="normal" fill="#17324d" text-anchor="start">Chưa biết</text><rect x="56" y="536" width="1088" height="84" fill="#eef3f6" stroke="none" rx="5"/><text x="75" y="568" font-size="25" font-weight="bold" fill="#17324d" text-anchor="start">Có thể nói: cột Week 2 cao hơn trong ảnh.</text><text x="75" y="602" font-size="22" font-weight="normal" fill="#17324d" text-anchor="start">Chưa thể nói: tăng bao nhiêu triệu, bao nhiêu %, hoặc vì sao.</text><text x="56" y="662" font-size="21" font-weight="normal" fill="#17324d" text-anchor="start">Khi có số: hai cột bắt đầu từ 0, một thang chung, giá trị ghi trực tiếp và kỳ đo rõ ràng.</text><text x="56" y="705" font-size="19" font-weight="normal" fill="#526578" text-anchor="start">Nguồn duy nhất: screenshot.png · Không phục dựng số từ pixel; không coi giá trị thiếu là 0.</text><text x="56" y="738" font-size="18" font-weight="normal" fill="#526578" text-anchor="start">Đây là bản mẫu bố cục, chưa phải biểu đồ định lượng. Các ô có kích thước bằng nhau chỉ để dàn trang.</text></g></svg>
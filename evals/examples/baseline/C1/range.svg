<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550"><title>Khoảng thời gian phản hồi từ cận dưới đến cận trên</title><rect width="1000" height="550" fill="#f7f7f4"/><text x="48" y="61" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#172b35" text-anchor="start">Khoảng thời gian phản hồi</text><text x="48" y="99" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" fill="#5b6870" text-anchor="start">Mỗi thanh chỉ trải từ cận dưới đến cận trên · đơn vị: phút</text><line x1="200.0" y1="142" x2="200.0" y2="408" stroke="#dce1e2"/><text x="200.0" y="438" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="middle">0</text><line x1="312.5" y1="142" x2="312.5" y2="408" stroke="#dce1e2"/><text x="312.5" y="438" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="middle">25</text><line x1="425.0" y1="142" x2="425.0" y2="408" stroke="#dce1e2"/><text x="425.0" y="438" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="middle">50</text><line x1="537.5" y1="142" x2="537.5" y2="408" stroke="#dce1e2"/><text x="537.5" y="438" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="middle">75</text><line x1="650.0" y1="142" x2="650.0" y2="408" stroke="#dce1e2"/><text x="650.0" y="438" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="middle">100</text><line x1="762.5" y1="142" x2="762.5" y2="408" stroke="#dce1e2"/><text x="762.5" y="438" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="middle">125</text><line x1="875.0" y1="142" x2="875.0" y2="408" stroke="#dce1e2"/><text x="875.0" y="438" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="middle">150</text><text x="48" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172b35" text-anchor="start">Basic</text><rect id="range-Basic" data-low="20" data-high="55" x="290.0" y="173" width="157.5" height="30" fill="#235969"/><text x="280.0" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172b35" text-anchor="end">20</text><text x="457.5" y="194" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172b35" text-anchor="start">55</text><text x="48" y="283" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172b35" text-anchor="start">Standard</text><rect id="range-Standard" data-low="45" data-high="90" x="402.5" y="262" width="202.5" height="30" fill="#235969"/><text x="392.5" y="283" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172b35" text-anchor="end">45</text><text x="615.0" y="283" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172b35" text-anchor="start">90</text><text x="48" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172b35" text-anchor="start">Complex</text><rect id="range-Complex" data-low="80" data-high="150" x="560.0" y="351" width="315.0" height="30" fill="#235969"/><text x="550.0" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172b35" text-anchor="end">80</text><text x="885.0" y="372" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" fill="#172b35" text-anchor="start">150</text><text x="925" y="438" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="start">phút</text><text x="48" y="489" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#235969" text-anchor="start">Đầu trái = low_minutes · đầu phải = high_minutes · độ dài = high − low</text><text x="48" y="524" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b6870" text-anchor="start">Nguồn không nêu trung vị, phân vị hay cỡ mẫu; không suy diễn những chỉ tiêu này.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><title>Tỷ lệ thắng hai đội theo hạng lead và sau chuẩn hóa</title><rect width="1200" height="760" fill="#f7f7f4"/><text x="54" y="62" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="700" fill="#172b35" text-anchor="start">B cao hơn ở tổng gộp; A cao hơn trong từng hạng lead</text><text x="54" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#5b6870" text-anchor="start">Tỷ lệ thắng = số thắng / lead đủ điều kiện · kỳ đo chưa được cung cấp</text><text x="54" y="159" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#172b35" text-anchor="start">SO SÁNH CÙNG HẠNG LEAD</text><rect x="794" y="141" width="17" height="17" fill="#235969"/><text x="820" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#172b35" text-anchor="start">Đội A</text><rect x="910" y="141" width="17" height="17" fill="#8c9da8"/><text x="936" y="156" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" fill="#172b35" text-anchor="start">Đội B</text><line x1="230.0" y1="190" x2="230.0" y2="438" stroke="#dce1e2"/><text x="230.0" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6870" text-anchor="middle">0%</text><line x1="378.0" y1="190" x2="378.0" y2="438" stroke="#dce1e2"/><text x="378.0" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6870" text-anchor="middle">20%</text><line x1="526.0" y1="190" x2="526.0" y2="438" stroke="#dce1e2"/><text x="526.0" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6870" text-anchor="middle">40%</text><line x1="674.0" y1="190" x2="674.0" y2="438" stroke="#dce1e2"/><text x="674.0" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6870" text-anchor="middle">60%</text><line x1="822.0" y1="190" x2="822.0" y2="438" stroke="#dce1e2"/><text x="822.0" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6870" text-anchor="middle">80%</text><line x1="970.0" y1="190" x2="970.0" y2="438" stroke="#dce1e2"/><text x="970.0" y="466" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#5b6870" text-anchor="middle">100%</text><text x="54" y="252" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172b35" text-anchor="start">Hạng High</text><rect x="230" y="217" width="444.0" height="28" fill="#235969"/><rect x="230" y="257" width="407.0" height="28" fill="#8c9da8"/><text x="686.0" y="237" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172b35" text-anchor="start">A: 60% (12/20)</text><text x="649.0" y="277" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172b35" text-anchor="start">B: 55% (33/60)</text><text x="54" y="389" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#172b35" text-anchor="start">Hạng Low</text><rect x="230" y="354" width="148.0" height="28" fill="#235969"/><rect x="230" y="394" width="111.0" height="28" fill="#8c9da8"/><text x="390.0" y="374" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172b35" text-anchor="start">A: 20% (12/60)</text><text x="353.0" y="414" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#172b35" text-anchor="start">B: 15% (3/20)</text><line x1="54" y1="504" x2="1145" y2="504" stroke="#dce1e2"/><text x="54" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#5b6870" text-anchor="start">TỔNG GỘP</text><text x="54" y="580" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b35" text-anchor="start">A 30%  ·  B 45%</text><text x="54" y="611" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="start">24/80          36/80</text><text x="431" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#5b6870" text-anchor="start">THÀNH PHẦN LEAD HIGH</text><text x="431" y="580" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b35" text-anchor="start">A 25%  ·  B 75%</text><text x="431" y="611" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="start">20/80          60/80</text><text x="832" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#5b6870" text-anchor="start">CÙNG CƠ CẤU 50/50</text><text x="832" y="580" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#172b35" text-anchor="start">A 40%  ·  B 35%</text><text x="832" y="611" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" fill="#5b6870" text-anchor="start">Trọng số High = Low = 50%</text><text x="54" y="676" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" fill="#235969" text-anchor="start">Tạm dừng chuyển coaching toàn bộ. Kiểm tra định nghĩa và thử có đối chứng trước khi mở rộng.</text><text x="54" y="718" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#5b6870" text-anchor="start">Chuẩn hóa là so sánh mô tả. Dữ liệu này không xác định hiệu quả nhân quả của coaching. Đề xuất chưa triển khai.</text></svg>